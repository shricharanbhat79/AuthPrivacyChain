{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Privacy Chain</title>
    <link href="{% static 'style.css' %}" rel="stylesheet" type="text/css" />
    <script type="text/javascript" src="{% static 'datetimepicker.js' %}"></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript">
        $(document).ready(function() {
            $('#datetimepicker1').datetimepicker({
                language: 'pt-BR'
            });
        });
    </script>
     <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            color: #333;
            background: url('{% static "images/dw.webp" %}') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* .header {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            margin-bottom: 20px;
            animation: slideIn 1s ease-in-out;
        } */

        .menu_nav {
            text-align: center;
            margin-bottom: 30px;
        }

        .menu_nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
        }

        .menu_nav a {
            text-decoration: none;
            color: #fff;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 8px;
            background: linear-gradient(45deg, #ff9800, #ff5722);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: inline-block;
        }

        .menu_nav a:hover {
            background: linear-gradient(45deg, #e65100, #bf360c);
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        .content_bg {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1.5s ease-in-out;
            text-align: center;
        }

        .message {
            font-size: 1.2rem;
            font-weight: bold;
            color: red;
        }

        .data-owner-img {
            width: 300px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="main_resize">
            <div class="header">
                <div class="logo">
                    <!-- <h1>AuthPrivacyChain: A Blockchain-Based Access Control Framework With Privacy Protection in Cloud</h1> -->
                </div>
            </div>

            <div class="content">
                <div class="content_bg">
                    <!-- Navigation Menu -->
                    <div class="menu_nav">
                        <ul>
                            <li><a href="{% url 'UploadImage' %}">Upload Data</a></li>
                            <li><a href="{% url 'viewnotification' %}">View Notification</a></li>
                            <li><a href="{% url 'settime' %}">Set Time</a></li>
                            <li><a href="{% url 'RevokeUser' %}">Revoke User</a></li>
                            <li><a href="{% url 'index' %}">Logout</a></li>
                        </ul>
                    </div>

                    <!-- User Time Setting Form -->
                    <center>
                        <h1>User List to Set Time</h1>
                        <br/>

                        <form name="from" method="post" action="{% url 'settimetouseraction' %}" onsubmit="return validate(this);">
                            {% csrf_token %}
                            
                            <label for="user_select">Select User Name:</label>
                            <select name="t1" id="user_select" required multiple> 
                                {% for uname in data %}
                                    <option value="{{ uname }}">{{ uname }}</option>
                                {% endfor %}
                            </select>
                            <br><br>

                            <label for="demo2">Starting Time:</label>
                            <input id="demo2" type="text" name="sdate" size="25" required>
                            <a href="javascript:NewCal('demo2','ddmmmyyyy',true,24)">
                                <img src="{% static 'images/cal.gif' %}" width="16" height="16" border="0" alt="Pick a date">
                            </a>
                            <br><br>

                            <label for="demo3">Ending Time:</label>
                            <input id="demo3" type="text" name="cdate" size="25" required>
                            <a href="javascript:NewCal('demo3','ddmmmyyyy',true,24)">
                                <img src="{% static 'images/cal.gif' %}" width="16" height="16" border="0" alt="Pick a date">
                            </a>
                            <br><br>

                            <input type="submit" value="Submit">
                        </form>
                    </center>
                </div>
            </div>
        </div>
    </div>

    <!-- Include Date Picker Script -->
    <script type="text/javascript" src="{% static 'NewCal.js' %}"></script>
</body>
</html>
