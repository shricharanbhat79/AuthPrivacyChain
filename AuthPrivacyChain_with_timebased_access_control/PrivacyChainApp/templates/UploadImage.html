{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Privacy Chain</title>
    <link href="{% static 'style.css' %}" rel="stylesheet" type="text/css" />
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: url('{% static "images/up.webp" %}') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            animation: fadeIn 1.5s ease-in-out;
        }

        .main {
            width: 50%;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 12px;
            /* box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); */
            text-align: center;
            animation: slideIn 1s ease-in-out;
        }

        .menu_nav {
            margin-bottom: 20px;
        }

        .menu_nav ul {
            list-style: none;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .menu_nav a {
            text-decoration: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 6px;
            background: #007bff;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: inline-block;
        }

        .menu_nav a:hover {
            background: #0056b3;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        form {
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        input[type="file"]::before {
            content: "📂 ";
        }

        select option[value="Doctor"]::before {
            content: "👨‍⚕️ ";
        }

        select option[value="Researcher"]::before {
            content: "🔬 ";
        }

        input[type="file"], select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input[type="submit"] {
            background: #28a745;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        input[type="submit"]:hover {
            background: #218838;
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="menu_nav">
            <ul>
                <li><a href="{% url 'UploadImage' %}">Upload Data</a></li>
                <li><a href="{% url 'settime' %}">Set Time</a></li>
                <li><a href="{% url 'RevokeUser' %}">Revoke User</a></li>
                <li><a href="{% url 'index' %}">Logout</a></li>
            </ul>
        </div>

        <h2><b>Patient Medical Report Upload</b></h2>
        <p style="font-size: 1rem; color: #333;">{{ data|safe }}</p>

        <form name="f1" method="post" action="{% url 'UploadImageAction' %}" enctype="multipart/form-data" onsubmit="return validate(this);">
            {% csrf_token %}
            <table>
                <tr>
                    <td><label for="t1">📂 Upload File</label></td>
                    <td><input type="file" id="t1" name="t1"></td>
                </tr>
                <tr>
                    <td><label for="t2">Access Control</label></td>
                    <td>
                        <select id="t2" name="t2" multiple>
                            <option value="Doctor">👨‍⚕️ Doctor</option>
                            <option value="Researcher">🔬 Researcher</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" style="text-align: center;">
                        <input type="submit" value="Upload File">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
