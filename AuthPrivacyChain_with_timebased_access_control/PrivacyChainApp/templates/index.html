{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthPrivacyChain - Secure Hospital System</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: url('https://imgs.search.brave.com/jQLfx9Mz9tRun-YCLqDfQ9kobUCrauIKOmmlsnAPi5c/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9pbWcu/ZnJlZXBpay5jb20v/cHJlbWl1bS1waG90/by9ibG9jay1jaGFp/bi1jb25jZXB0LWNo/YWluLWNvbnNpc3Rz/LW5ldHdvcmstY29u/bmVjdGlvbnMtM2Qt/cmVuZGVyaW5nXzk3/NDcyOS0xMTg5NjQu/anBnP3NlbXQ9YWlz/X2h5YnJpZA') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 0px 25px rgba(255, 255, 255, 0.3);
            animation: fadeIn 1.5s ease-in-out;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 15px;
            animation: slideDown 1s ease-in-out;
        }
        .buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            padding: 14px 26px;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
        }
        .btn-primary {
            background: linear-gradient(135deg, #28a745, #218838);
            color: white;
            box-shadow: 0px 4px 15px rgba(40, 167, 69, 0.3);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #218838, #1e7e34);
            transform: scale(1.1);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            box-shadow: 0px 4px 15px rgba(0, 123, 255, 0.3);
        }
        .btn-secondary:hover {
            background: linear-gradient(135deg, #0056b3, #004085);
            transform: scale(1.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .btn img {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AuthPrivacyChain: Secure Hospital System</h1>
        <p>Blockchain-based Access Control with Privacy Protection</p>
        <div class="buttons">
            <a href="{% url 'index' %}" class="btn btn-primary">
                <img src="https://cdn-icons-png.flaticon.com/512/25/25694.png" alt="Home"> Home
            </a>
            <a href="{% url 'Login' %}" class="btn btn-secondary">
                <img src="https://cdn-icons-png.flaticon.com/512/1828/1828395.png" alt="Data Owner"> Data Owner
            </a>
            <a href="{% url 'Login' %}" class="btn btn-primary">
                <img src="https://cdn-icons-png.flaticon.com/512/1006/1006555.png" alt="Data Users"> Data Users
            </a>
            <a href="{% url 'Signup' %}" class="btn btn-secondary">
                <img src="https://cdn-icons-png.flaticon.com/512/747/747376.png" alt="Signup"> Signup
            </a>
        </div>
    </div>
</body>
</html>
